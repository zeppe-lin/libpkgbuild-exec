name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: GCC shared, cc: gcc, cxx: g++, mode: shared, buildtype: debug}
          - {name: GCC static, cc: gcc, cxx: g++, mode: static, buildtype: debug}
          - {name: Clang shared, cc: clang, cxx: clang++, mode: shared, buildtype: debug}
          - {name: Clang static, cc: clang, cxx: clang++, mode: static, buildtype: debug}
          - {name: GCC release, cc: gcc, cxx: g++, mode: shared, buildtype: release}
    name: ${{ matrix.name }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgsource, ref: v4.1.0, path: dependencies/libpkgsource}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgstate, ref: 94e59e64b842a396bf5bb9eacc0f262c1e266c5f, path: dependencies/libpkgstate}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgimage, ref: 179f14759b48f006dc922579314d56637f0522a8, path: dependencies/libpkgimage}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgcatalog, ref: v4.0.0, path: dependencies/libpkgcatalog}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgresolve, ref: v4.0.0, path: dependencies/libpkgresolve}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgbuild, ref: v3.0.1, path: dependencies/libpkgbuild}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgfetch, ref: v3.0.0, path: dependencies/libpkgfetch}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgexec, ref: v2.1.1, path: dependencies/libpkgexec}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgbuild-image, ref: v1.0.1, path: dependencies/libpkgbuild-image}}
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang libarchive-dev libbz2-dev libcurl4-openssl-dev liblz4-dev \
            liblzma-dev libssl-dev libxml2-dev libzstd-dev ninja-build \
            pkg-config python3-venv scdoc zlib1g-dev
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install 'meson==1.10.2'
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"
      - name: Configure, build, and test
        env: &sources
          LIBPKGSOURCE_SOURCE: dependencies/libpkgsource
          LIBPKGSTATE_SOURCE: dependencies/libpkgstate
          LIBPKGIMAGE_SOURCE: dependencies/libpkgimage
          LIBPKGCATALOG_SOURCE: dependencies/libpkgcatalog
          LIBPKGRESOLVE_SOURCE: dependencies/libpkgresolve
          LIBPKGBUILD_SOURCE: dependencies/libpkgbuild
          LIBPKGFETCH_SOURCE: dependencies/libpkgfetch
          LIBPKGEXEC_SOURCE: dependencies/libpkgexec
          LIBPKGBUILD_IMAGE_SOURCE: dependencies/libpkgbuild-image
          MESON_BUILDTYPE: ${{ matrix.buildtype }}
        run: ./ci/configure-and-test.sh build ${{ matrix.mode }}

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: GCC, cc: gcc, cxx: g++}
          - {name: Clang, cc: clang, cxx: clang++}
    name: ${{ matrix.name }} address,undefined
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgsource, ref: v4.1.0, path: dependencies/libpkgsource}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgstate, ref: 94e59e64b842a396bf5bb9eacc0f262c1e266c5f, path: dependencies/libpkgstate}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgimage, ref: 179f14759b48f006dc922579314d56637f0522a8, path: dependencies/libpkgimage}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgcatalog, ref: v4.0.0, path: dependencies/libpkgcatalog}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgresolve, ref: v4.0.0, path: dependencies/libpkgresolve}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgbuild, ref: v3.0.1, path: dependencies/libpkgbuild}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgfetch, ref: v3.0.0, path: dependencies/libpkgfetch}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgexec, ref: v2.1.1, path: dependencies/libpkgexec}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgbuild-image, ref: v1.0.1, path: dependencies/libpkgbuild-image}}
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang libarchive-dev libbz2-dev libcurl4-openssl-dev liblz4-dev \
            liblzma-dev libssl-dev libxml2-dev libzstd-dev ninja-build \
            pkg-config python3-venv scdoc zlib1g-dev
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install 'meson==1.10.2'
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"
      - name: Configure, build, and test
        env:
          LIBPKGSOURCE_SOURCE: dependencies/libpkgsource
          LIBPKGSTATE_SOURCE: dependencies/libpkgstate
          LIBPKGIMAGE_SOURCE: dependencies/libpkgimage
          LIBPKGCATALOG_SOURCE: dependencies/libpkgcatalog
          LIBPKGRESOLVE_SOURCE: dependencies/libpkgresolve
          LIBPKGBUILD_SOURCE: dependencies/libpkgbuild
          LIBPKGFETCH_SOURCE: dependencies/libpkgfetch
          LIBPKGEXEC_SOURCE: dependencies/libpkgexec
          LIBPKGBUILD_IMAGE_SOURCE: dependencies/libpkgbuild-image
          MESON_BUILDTYPE: debug
          MESON_SANITIZE: address,undefined
        run: ./ci/configure-and-test.sh build-sanitize shared
